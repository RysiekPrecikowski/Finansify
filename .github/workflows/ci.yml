name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One command, the same one `pnpm check` runs locally before a commit --
      # build, lint, typecheck, test, format:check, all cached and scheduled by turbo.
      - run: pnpm check

      # A schema edit that never got a migration passes every other check in
      # this job: it typechecks, it tests, and drizzle only notices when
      # someone next runs generate. Regenerating here must produce nothing --
      # anything new or modified means src/schema and migrations/ have
      # diverged, and the divergence would otherwise reach production as a
      # table that does not match the code reading it.
      #
      # `generate` diffs the schema against the migrations already on disk and
      # needs no database connection (see packages/db/drizzle.config.ts).
      - name: Schema and migrations must agree
        run: |
          pnpm --filter @finansify/db db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            echo "::error::packages/db/src/schema and packages/db/migrations disagree. Run 'pnpm --filter @finansify/db db:generate' and commit the result."
            git status --short packages/db/migrations
            git --no-pager diff -- packages/db/migrations
            exit 1
          fi

  migrate:
    needs: check
    # push-to-main only, never pull_request -- a fork PR produces a
    # pull_request event and can never satisfy this, so it never sees
    # DATABASE_URL_UNPOOLED. (A prior workflow_run-triggered version of this
    # job could be armed by a fork PR whose branch happened to be named
    # `main`; this job design removes that class rather than filtering it.)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Own group, not the workflow-level one above: that group cancels on every
    # new push to main, which would kill drizzle-kit mid-migration if two
    # merges land close together. Migrations queue instead of being cancelled.
    concurrency:
      group: migrate-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # drizzle.config.ts falls back to an empty connection string, which fails
      # deep inside drizzle-kit. Name the real cause instead.
      - name: Require DATABASE_URL_UNPOOLED
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
        run: |
          if [ -z "$DATABASE_URL_UNPOOLED" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is not set. Provision Neon and add it as a repository secret (docs/deployment.md)."
            exit 1
          fi

      # Unpooled connection -- drizzle-kit migrate needs a direct session, not
      # the pooled one the app uses. See docs/deployment.md.
      - run: pnpm --filter @finansify/db db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
