name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Turborepo Remote Cache
        uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
        with:
          team: ${{ vars.TURBO_TEAM }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # One command, the same one `pnpm check` runs locally before a commit --
      # build, lint, typecheck, test, format:check, all cached and scheduled by turbo.
      - run: pnpm check

      # A schema edit that never got a migration passes every other check in
      # this job: it typechecks, it tests, and drizzle only notices when
      # someone next runs generate. Regenerating here must produce nothing --
      # anything new or modified means src/schema and migrations/ have
      # diverged, and the divergence would otherwise reach production as a
      # table that does not match the code reading it.
      #
      # `generate` diffs the schema against the migrations already on disk and
      # needs no database connection (see packages/db/drizzle.config.ts).
      #
      # Deliberately `pnpm exec` in the package directory rather than
      # `pnpm --filter @finansify/db db:generate`: a filter that matches nothing
      # prints "No projects matched the filters" and exits 0, and so does a
      # script name that no longer exists. Either would leave this step passing
      # forever, with a clean `git status` precisely because generate never ran.
      # `pnpm exec` exits non-zero when the binary is gone, so a rename breaks
      # the check loudly instead of disarming it.
      - name: Schema and migrations must agree
        working-directory: packages/db
        run: |
          pnpm exec drizzle-kit generate
          if [ -n "$(git status --porcelain migrations)" ]; then
            echo "::error::packages/db/src/schema and packages/db/migrations disagree. Run 'pnpm --filter @finansify/db db:generate' and commit the result."
            git status --short migrations
            # A missing migration arrives as an untracked file, which `git diff`
            # ignores, so the log would name the file without ever showing the
            # statement. Staging the intent to add puts it in the diff; the
            # pathspec keeps the 700-line snapshot out of it, and `git status`
            # above has already reported that the snapshot moved.
            git add --intent-to-add -- migrations
            git --no-pager diff -- 'migrations/*.sql'
            exit 1
          fi

  # Migrations run twice, and the order is the point: pre-production first,
  # production only if that succeeded. See ADR 0017.
  #
  # The failure this absorbs is specific. `neon-http` cannot run a
  # multi-statement transaction, so a migration that breaks partway leaves its
  # statements committed and never records a journal row — the database is
  # wedged until someone drops the half-created objects by hand. Discovering
  # that on production, as happened on 2026-08-16, means the fix is done under
  # time pressure against live data. Discovering it on a branch means the fix
  # is done on a copy nobody is using.
  migrate-preproduction:
    needs: check
    # push-to-main only, never pull_request -- a fork PR produces a
    # pull_request event and can never satisfy this, so it never sees the
    # connection secrets. (A prior workflow_run-triggered version of this
    # job could be armed by a fork PR whose branch happened to be named
    # `main`; this job design removes that class rather than filtering it.)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Own group, not the workflow-level one above: that group cancels on every
    # new push to main, which would kill a migration mid-flight if two merges
    # land close together. Migrations queue instead of being cancelled — and
    # under `neon-http` a cancelled migration is exactly the wedge above.
    concurrency:
      group: migrate-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Unpooled connection -- migrations need a direct session, not the pooled
      # one the app uses. `scripts/migrate.ts` names the missing variable and
      # prints the driver's own error; see docs/deployment.md.
      - run: pnpm --filter @finansify/db db:migrate
        env:
          MIGRATION_TARGET: pre-production
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED_PREPRODUCTION }}

  migrate-production:
    # The gate. Production is never touched unless the identical migration set
    # has just applied cleanly to a branch with production's schema.
    needs: migrate-preproduction
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: migrate-main
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @finansify/db db:migrate
        env:
          MIGRATION_TARGET: production
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
