name: Migrate

# Runs after CI succeeds on main, not on every push directly — a migration
# should never apply against a commit that hasn't passed pnpm check.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: migrate-main
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # The exact commit CI validated, not whatever main points at now — a
      # later merge must not smuggle its migration in on this run's back.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # drizzle.config.ts falls back to an empty connection string, which fails
      # deep inside drizzle-kit. Name the real cause instead.
      - name: Require DATABASE_URL_UNPOOLED
        run: |
          if [ -z "${{ secrets.DATABASE_URL_UNPOOLED }}" ]; then
            echo "::error::DATABASE_URL_UNPOOLED is not set. Provision Neon and add it as a repository secret (docs/deployment.md)."
            exit 1
          fi

      # Unpooled connection — drizzle-kit migrate needs a direct session, not
      # the pooled one the app uses. See docs/deployment.md.
      - run: pnpm --filter @finansify/db db:migrate
        env:
          DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
